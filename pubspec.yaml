name: tankograd
description: "Vampire: The Masquerade LARP companion app for the Tankograd community."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.1"

dependencies:
  audioplayers: ^6.5.0
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  connectivity_plus: ^7.0.0
  dio: ^5.9.0
  equatable: ^2.0.7
  file_picker: ^10.2.0
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_compass: ^0.8.1
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^19.4.0
  flutter_map: ^8.2.1
  flutter_svg: ^2.0.13
  geolocator: ^14.0.2
  hive: ^2.2.3
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  localstorage: ^6.0.0
  orientation: ^1.3.0
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1
  timezone: ^0.10.1
  universal_html: ^2.2.4
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/crown.svg
    - assets/vtm_background.jpg
    - assets/clans/
    - web/telegram_proxy.html
